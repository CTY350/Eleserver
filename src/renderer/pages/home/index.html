<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Eleserver</title>
    <link rel="stylesheet" href="style.css">
    <script src="renderer.js" defer></script>
</head>
<body>
<header>
    <h1>Servers</h1>
</header>
<main>
    <div class="top-bar">
        <button class="create-button">
            <svg
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
            >
                <path
                        d="M12 5V19M5 12H19"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                />
            </svg>
            Create
        </button>
    </div>
    <div class="server-list"></div>
</main>
<div class="overlay">
    <div class="form">
        <form id="server-form">
            <label for="server-name">Server Name</label>
            <input type="text" id="server-name" placeholder="Server Name" name="serverName" minlength="3" maxlength="16" required/>

            <label for="server-software">Software</label>
            <select id="server-software" name="serverSoftware">
                <option value="vanilla">Vanilla</option>
                <option value="fabric">Fabric</option>
                <option value="paper">Paper</option>
                <option value="purpur">Purpur</option>
                <option value="forge">Forge</option>
            </select>

            <label for="server-version">Version</label>
            <select id="server-version" name="serverVersion"></select>

        </form>
        <button type="submit" form="server-form" id="create-button">
            <span class="create-text" id="normal-text">Create</span>
            <span id="loader" class="create-text"></span>
        </button>
    </div>
</div>
</body>
</html>
