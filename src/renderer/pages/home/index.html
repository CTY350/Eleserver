<!doctype html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Eleserver</title>
    <link rel="stylesheet" href="style.css">
    <script src="renderer.js" defer></script>
</head>
<body>
<header>
    <h1>Servers</h1>
</header>
<main>
    <div class="top-bar">

                    height="20"

                        stroke-width="2"

    </div>
