<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';"/>
    <title>Eleserver</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="renderer.js" defer></script>
</head>
<body>
<div id="home-page" class="page">
    <header class="server-header">
        <div id="server-main">
            <div id="server-info">
                <h1 id="server-name"></h1>
                <p id="server-version"></p>
                <button id="connect-button">Connect</button>
            </div>
            <div id="server-status">
                <img src="" alt="" id="server-status-icon">
                <p id="server-status-text"></p>
            </div>
        </div>
        <button id="start-button">
            <img src="" alt="" id="button-icon">
            <p id="button-text"></p>
        </button>
    </header>
    <div class="overlay">
        <div id="connect-modal">
            <div id="ip">
                <div id="local-ip-container">
                    <strong>Local:</strong>
                    <span id="local-ip"></span>
                </div>
                <div id="public-ip-container">
                    <strong>Public:</strong>
                    <span id="public-ip"></span>
                </div>
            </div>
            <button id="port-button">Open Port</button>
        </div>
    </div>
</div>
<div id="console-page" class="page">
    <div id="console-container">
        <div id="console"></div>
        <div id="console-input">
            <img src="../../assets/prompt.svg" alt="">
            <form id="console-form">
                <input type="text" placeholder="Type here..." id="input">
            </form>
        </div>
    </div>
</div>

<div id="navbar">
    <div id="home-bar" class="page-bar">
        <img src="../../assets/navbar-icons/home.svg" alt="">
        Home
    </div>
    <div id="console-bar" class="page-bar">
        <img src="../../assets/navbar-icons/console.svg" alt="">
        Console
    </div>
</div>
</body>
</html>
