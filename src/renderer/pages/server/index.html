<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Eleserver</title>
    <link rel="stylesheet" href="style.css">
    <script src="renderer.js" defer></script>
</head>
<body>
<div id="home-page">
    <header class="server-header">
        <div id="server-main">
            <div id="server-info">
                <h1 id="server-name"></h1>
                <p id="server-version"></p>
            </div>
            <div id="server-status">
                <img src="" alt="" id="server-status-icon">
                <p id="server-status-text"></p>
            </div>
        </div>
        <button id="start-button">
            <img src="" alt="" id="button-icon">
            <p id="button-text"></p>
        </button>
    </header>
    <main class="server-content">
        <div id="server-ip"></div>
        <div id="min-ram"></div>
        <div id="max-ram"></div>
    </main>
</div>
</body>
</html>
