<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Server</title>
    <link rel="stylesheet" href="style.css">
    <script src="renderer.js" defer></script>
</head>
<body>
<header class="server-header">
    <div id="server-info">
        <h1 id="server-name"></h1>
        <p id="server-version"></p>
    </div>
    <div id="server-status"></div>

    <button id="start-stop-button"></button>
</header>
<main class="server-content">
    <div id="server-ip"></div>
    <div id="min-ram"></div>
    <div id="max-ram"></div>
</main>
</body>
</html>
